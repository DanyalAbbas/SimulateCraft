# SimulateCraft docs — Material + mkdocstrings
# Module pages under the sidebar are generated by docs/gen_ref_pages.py.

site_name: SimulateCraft
site_description: LLM-driven AI agent simulations in Minecraft
site_url: https://danyalabbas.github.io/SimulateCraft/
repo_url: https://github.com/DanyalAbbas/SimulateCraft
repo_name: DanyalAbbas/SimulateCraft

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: teal
      accent: light green
      toggle:
        icon: material/weather-night
        name: Dark mode
  font:
    text: Outfit
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            group_by_category: true
            merge_init_into_class: true
            filters:
              - "!^_"
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Live viewer: viewer.md
  - API reference: reference/

watch:
  - src/simulatecraft

exclude_docs: |
  gen_ref_pages.py
  **/SUMMARY.md
