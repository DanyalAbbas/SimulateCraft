[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulatecraft"
version = "0.1.0"
description = "LLM-driven AI agent simulations in Minecraft — powered by Mineflayer and pydantic-ai."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SimulateCraft contributors" }]
keywords = ["minecraft", "agents", "simulation", "llm", "mineflayer", "pydantic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
]

# Core: simulation loop + web viewer. LLM providers live in the [llm] extra.
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
    "pydantic-ai[groq,openrouter]==2.35.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hatchling>=1.21",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
simulatecraft = "simulatecraft.cli:main"

[project.urls]
Homepage = "https://github.com/DanyalAbbas/SimulateCraft"
Documentation = "https://danyalabbas.github.io/SimulateCraft/"

[tool.hatch.build.targets.wheel]
packages = ["src/simulatecraft"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM108",
    "B027",
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
