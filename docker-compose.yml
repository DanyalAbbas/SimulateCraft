services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: simulatecraft-mc
    ports:
      - "25565:25565"
      - "25575:25575"
    environment:
      EULA: "TRUE"
      VERSION: "1.21.4"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      TYPE: VANILLA
      LEVEL: "world"
      SEED: ${SEED:-}
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "simulatecraft"
    volumes:
      # Persist / import worlds here (place a Java world folder at data/minecraft/world)
      - ./data/minecraft:/data
    tty: true
    stdin_open: true
    restart: unless-stopped
